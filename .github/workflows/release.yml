name: Release

# Tag pushes (v*.*.*) build the full matrix and create a DRAFT release with all
# bundles attached (publish it from the Releases page when you're ready).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build.yml
    with:
      tagName: ${{ github.ref_name }}
      draft: true
