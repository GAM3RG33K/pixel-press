name: Release

# Build and publish pixel-press for every supported platform, following the
# official Tauri v2 GitHub pipeline:
#   https://v2.tauri.app/distribute/pipelines/github/
#
# Flavors:
#   - Production: tag v0.1.0 -> draft release ("pixel-press", com.pixelpress.app)
#   - Development: tag v0.1.0-dev -> prerelease ("pixel-press Dev", com.pixelpress.app.dev).
#     The `*` in the tag pattern crosses `-`, so `v*.*.*` matches both. The dev build installs
#     as a separate app alongside production and never overrides it.
#   - Actions → Release → Run workflow (flavor: prod | dev) -> build-only dry run, no release.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0        # production
#   git tag -a v0.1.0-dev -m "v0.1.0-dev" && git push origin v0.1.0-dev   # dev prerelease
#
# Dry run without a tag: Actions → Release → Run workflow (flavor: prod | dev).
# Builds all four shipping targets but creates NO release and uploads nothing.
#
# Platforms (docs/README "Targets"):
#   - macOS Apple Silicon  (aarch64-apple-darwin)  .dmg
#   - macOS Intel          (x86_64-apple-darwin)   .dmg
#   - Linux x64            (ubuntu-22.04)          .AppImage, .deb
#   - Linux ARM64          (ubuntu-22.04-arm)      .AppImage, .deb
#
# Windows is intentionally not built: the last release run (v0.1.0-dev) failed on the
# Windows leg and the build is excluded until the failure is understood and fixed.
# Do not add it back without a green release run.
# macOS builds are ad-hoc signed (tauri.conf.json > bundle > macOS > signingIdentity "-") —
# this is required for Apple Silicon apps downloaded from the internet; without it they show
# the "pixel-press Dev.app is damaged and can't be opened" dialog.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor — dev installs as 'pixel-press Dev' (com.pixelpress.app.dev), side-by-side with production"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for the bun toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # bun is installed from the npm registry: setup-bun downloads from
      # GitHub Releases, which intermittently 504s.
      - name: Install bun
        run: npm install -g bun@1.4.4

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils mold

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets are only needed on the macOS runners (both arches).
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      # Dedicated cache for the llama.cpp cmake build tree (the single biggest
      # compile in the pipeline). Independent of rust-cache's keying; restored
      # on any key prefix hit.
      - name: Cache llama.cpp cmake build
        uses: actions/cache@v4
        with:
          path: src-tauri/target/llama-cmake-cache
          key: llama-cmake-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            llama-cmake-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve flavor
        id: flavor
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FLAVOR: ${{ inputs.flavor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            flavor="$DISPATCH_FLAVOR"
          elif [[ "$REF_NAME" == *-dev* ]]; then
            flavor=dev
          else
            flavor=prod
          fi
          echo "Resolved flavor: $flavor"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # mold on Linux slashes final link time (~30–60s per leg).
          RUSTFLAGS: ${{ startsWith(matrix.platform, 'ubuntu') && '-C link-arg=-fuse-ld=mold' || '' }}
          # Updater signing keypair — set in GitHub Secrets (one-time setup).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only a tag push publishes. On workflow_dispatch these are empty,
          # which tauri-action treats as "build only, upload nothing".
          # *-dev* tags build the dev flavor as a PRERELEASE named
          # "pixel-press <tag> (Development)"; plain tags build production.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ steps.flavor.outputs.flavor == 'dev' && format('pixel-press {0} (Development)', github.ref_name) || (github.ref_type == 'tag' && format('pixel-press {0}', github.ref_name) || '') }}
          # Dev tags (v*-dev) publish as prereleases so prod users' "latest release" stays put; prod tags stay drafts.
          releaseDraft: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-dev') }}
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          releaseBody: |
            **pixel-press** — local-first video compression for the web. Nothing uploads; everything runs on your machine.

            First launch downloads FFmpeg/FFprobe and (optionally) a ~270 MB on-device LLM — SHA-256-verified, installed into your app data directory. The app then works fully offline. No accounts, no telemetry.

            > Ad-hoc signed for Apple Silicon (no Developer ID yet) — macOS Gatekeeper still blocks on first open: right-click → Open, or System Settings → Privacy & Security → Open Anyway.

            | Platform | Asset | Requirements |
            | --- | --- | --- |
            | macOS Apple Silicon | `*_aarch64.dmg` | macOS 11+ on Apple Silicon |
            | macOS Intel | `*_x64.dmg` | macOS 10.15+ on Intel |
            | Linux x64 | `*_amd64.AppImage` or `*_amd64.deb` | glibc ≥ 2.31, WebKitGTK 4.1 |
            | Linux ARM64 | `*_arm64.AppImage` or `*_arm64.deb` | Raspberry Pi OS / Ubuntu ARM64 |

            `setup-manifest.json` lists SHA-256 + size + source for the FFmpeg/FFprobe/LLM artifacts downloaded on first launch.

            pixel-press is MIT-licensed. FFmpeg/FFprobe are separate GPL/LGPL binaries downloaded by you at first launch; LLM weights (SmolLM2-360M, Apache-2.0) likewise. See `THIRD_PARTY_NOTICES.md`.

            > **Flavors:** tags containing `-dev` (e.g. `v0.1.0-dev`) produce the development flavor — **"pixel-press Dev"** (`com.pixelpress.app.dev`) — marked as a prerelease. It installs side-by-side with production and never overrides it. Plain tags produce the production build.
          args: ${{ matrix.args }} ${{ steps.flavor.outputs.flavor == 'dev' && '--config src-tauri/tauri.dev.conf.json' || '' }}

      # Dev releases publish a copy of the updater JSON to GitHub Pages so the dev
      # flavor's updater (pointing at gam3rg33k.github.io/pixel-press/dev-latest.json)
      # can find the newest dev build. The gh-pages branch also carries the landing
      # page (site/ on main) — this step SYNCS both instead of wiping the branch.
      - name: Publish landing page + dev-latest.json to GitHub Pages
        if: ${{ steps.flavor.outputs.flavor == 'dev' && github.ref_type == 'tag' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Publishing gh-pages (site/ + dev-latest.json) for $TAG"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json"
          tmp_json="$(mktemp)"
          if ! curl -fsSL "$url" -o "$tmp_json"; then
            echo "::error::Could not fetch latest.json from $url — did the build upload it?"
            exit 1
          fi
          work="$(mktemp -d)/pages"
          mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git"
          # Clone existing gh-pages if present; otherwise create an orphan root.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q --depth=1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
            git rm -rfq --ignore-unmatch .
          fi
          # Refresh the landing page from site/ on the tagged commit; keep dev-latest.json fresh.
          rm -rf ./*
          cp -R "$GITHUB_WORKSPACE/site/." ./
          cp "$tmp_json" ./dev-latest.json
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
            exit 0
          fi
          git commit -q -m "chore: publish landing page + dev-latest.json ($TAG)"
          git push -q origin gh-pages
