name: Release

# Build and publish pixel-press for every supported platform, following the
# official Tauri v2 GitHub pipeline:
#   https://v2.tauri.app/distribute/pipelines/github/
#
# Flavors:
#   - Production: tag v0.1.0 -> draft release ("pixel-press", com.pixelpress.app)
#   - Development: tag v0.1.0-dev -> draft PRERELEASE ("pixel-press Dev", com.pixelpress.app.dev).
#     The `*` in the tag pattern crosses `-`, so `v*.*.*` matches both. The dev build installs
#     as a separate app alongside production and never overrides it.
#   - Actions → Release → Run workflow (flavor: prod | dev) -> build-only dry run, no release.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0        # production
#   git tag -a v0.1.0-dev -m "v0.1.0-dev" && git push origin v0.1.0-dev   # dev prerelease
#
# Dry run without a tag: Actions → Release → Run workflow (flavor: prod | dev).
# Builds all four shipping targets but creates NO release and uploads nothing.
#
# Platforms (docs/README "Targets"):
#   - macOS Apple Silicon  (aarch64-apple-darwin)  .dmg
#   - macOS Intel          (x86_64-apple-darwin)   .dmg
#   - Linux x64            (ubuntu-22.04)          .AppImage, .deb
#   - Linux ARM64          (ubuntu-22.04-arm)      .AppImage, .deb
#
# Windows is intentionally not built: the last release run (v0.1.0-dev) failed on the
# Windows leg and the build is excluded until the failure is understood and fixed.
# Do not add it back without a green release run.
# macOS builds are ad-hoc signed (tauri.conf.json > bundle > macOS > signingIdentity "-") —
# this is required for Apple Silicon apps downloaded from the internet; without it they show
# the "pixel-press Dev.app is damaged and can't be opened" dialog.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor — dev installs as 'pixel-press Dev' (com.pixelpress.app.dev), side-by-side with production"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for the bun toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # bun is installed from the npm registry: setup-bun downloads from
      # GitHub Releases, which intermittently 504s.
      - name: Install bun
        run: npm install -g bun@1.4.4

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets are only needed on the macOS runners (both arches).
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve flavor
        id: flavor
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FLAVOR: ${{ inputs.flavor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            flavor="$DISPATCH_FLAVOR"
          elif [[ "$REF_NAME" == *-dev* ]]; then
            flavor=dev
          else
            flavor=prod
          fi
          echo "Resolved flavor: $flavor"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only a tag push publishes. On workflow_dispatch these are empty,
          # which tauri-action treats as "build only, upload nothing".
          # *-dev* tags build the dev flavor as a DRAFT PRERELEASE named
          # "pixel-press <tag> (Development)"; plain tags build production.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ steps.flavor.outputs.flavor == 'dev' && format('pixel-press {0} (Development)', github.ref_name) || (github.ref_type == 'tag' && format('pixel-press {0}', github.ref_name) || '') }}
          releaseDraft: true
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          releaseBody: |
            **pixel-press** — local-first video compression for the web. Nothing uploads; everything runs on your machine.

            First launch downloads FFmpeg/FFprobe and (optionally) a ~270 MB on-device LLM — SHA-256-verified, installed into your app data directory. The app then works fully offline. No accounts, no telemetry.

            > Ad-hoc signed for Apple Silicon (no Developer ID yet) — macOS Gatekeeper still blocks on first open: right-click → Open, or System Settings → Privacy & Security → Open Anyway.

            | Platform | Asset | Requirements |
            | --- | --- | --- |
            | macOS Apple Silicon | `*_aarch64.dmg` | macOS 11+ on Apple Silicon |
            | macOS Intel | `*_x64.dmg` | macOS 10.15+ on Intel |
            | Linux x64 | `*_amd64.AppImage` or `*_amd64.deb` | glibc ≥ 2.31, WebKitGTK 4.1 |
            | Linux ARM64 | `*_arm64.AppImage` or `*_arm64.deb` | Raspberry Pi OS / Ubuntu ARM64 |

            `setup-manifest.json` lists SHA-256 + size + source for the FFmpeg/FFprobe/LLM artifacts downloaded on first launch.

            pixel-press is MIT-licensed. FFmpeg/FFprobe are separate GPL/LGPL binaries downloaded by you at first launch; LLM weights (SmolLM2-360M, Apache-2.0) likewise. See `THIRD_PARTY_NOTICES.md`.

            > **Flavors:** tags containing `-dev` (e.g. `v0.1.0-dev`) produce the development flavor — **"pixel-press Dev"** (`com.pixelpress.app.dev`) — marked as a prerelease. It installs side-by-side with production and never overrides it. Plain tags produce the production build.
          args: ${{ matrix.args }} ${{ steps.flavor.outputs.flavor == 'dev' && '--config src-tauri/tauri.dev.conf.json' || '' }}
