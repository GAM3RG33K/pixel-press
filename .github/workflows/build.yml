name: Build (reusable)

# Reusable build matrix. Called by ci.yml (dry runs) and release.yml (tags).
# With tagName unset the matrix still builds everything and uploads workflow
# artifacts, but no GitHub Release is touched.
on:
  workflow_call:
    inputs:
      tagName:
        description: "Release tag (e.g. v0.1.0). Empty = build-only, no release."
        type: string
        default: ""
      draft:
        description: "Create the release as a draft."
        type: boolean
        default: true

jobs:
  publish:
    permissions:
      contents: ${{ inputs.tagName != '' && 'write' || 'read' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: --bundles appimage,deb
          - name: Windows x64
            platform: windows-latest
            args: --bundles msi
          - name: Windows ARM64
            platform: windows-11-arm
            args: --bundles msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and (optionally) release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tagName }}
          releaseName: "pixel-press ${{ inputs.tagName }}"
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ contains(inputs.tagName, '-') }}
          releaseBody: |
            **pixel-press** — local-first video compression for the web. Nothing uploads; everything runs on your machine.

            First launch downloads FFmpeg/FFprobe and (optionally) a ~270 MB on-device LLM — SHA-256-verified, installed into your app data directory. The app then works fully offline. No accounts, no telemetry.

            > Unsigned build — macOS Gatekeeper / Windows SmartScreen will warn. macOS: right-click → Open. Windows: More info → Run anyway.

            | Platform | Asset | Requirements |
            | --- | --- | --- |
            | macOS Apple Silicon | `*_aarch64.dmg` | macOS 11+ on Apple Silicon |
            | Windows x64 | `*_x64_en-US.msi` | Windows 10 1809+, WebView2 (built in on Win 11) |
            | Windows ARM64 | `*_arm64_en-US.msi` | Windows 11 on ARM |
            | Linux x64 | `*_amd64.AppImage` or `*_amd64.deb` | glibc ≥ 2.31, WebKitGTK 4.1 |
            | Linux ARM64 | `*_arm64.AppImage` or `*_arm64.deb` | Raspberry Pi OS / Ubuntu ARM64 |

            `setup-manifest.json` lists SHA-256 + size + source for the FFmpeg/FFprobe/LLM artifacts downloaded on first launch.

            pixel-press is MIT-licensed. FFmpeg/FFprobe are separate GPL/LGPL binaries downloaded by you at first launch; LLM weights (SmolLM2-360M, Apache-2.0) likewise. See `THIRD_PARTY_NOTICES.md`.
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: ${{ inputs.tagName == '' }}
          workflowArtifactNamePattern: "[name]-[version]-[platform]-[arch]-[bundle]"
