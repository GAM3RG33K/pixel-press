[package]
name = "pixel-press"
version = "0.1.0"
description = "pixel-press — local video compressor. Native desktop app (Tauri v2)."
authors = ["Harshvardhan Joshi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
llama-cpp-4 = { version = "0.11", default-features = false, features = ["openmp", "prebuilt"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
sha2 = "0.11"
zip = "9"
futures-util = "0.3"
hex = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-4 = { version = "0.11", default-features = false, features = ["metal", "openmp", "prebuilt"] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
llama-cpp-4 = { version = "0.11", default-features = false, features = ["openmp", "prebuilt", "native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
